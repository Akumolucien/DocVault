<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DocVault — Sign in</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="auth-page">

  <main class="auth-container">

    <section class="auth-card">

      <div class="auth-logo">

        <div class="brand-icon auth-brand-icon">
          D
        </div>

        <div class="logo large">
          Doc<span>Vault</span>
        </div>

      </div>


      <div class="auth-heading">

        <h1 id="authTitle">
          Welcome back
        </h1>

        <p
          class="muted"
          id="authSubtitle"
        >
          Sign in to continue to your vault.
        </p>

      </div>


      <div
        class="auth-tabs"
        id="authTabs"
      >

        <button
          class="auth-tab active"
          type="button"
          data-mode="login"
        >
          Log in
        </button>

        <button
          class="auth-tab"
          type="button"
          data-mode="signup"
        >
          Sign up
        </button>

      </div>


      <div
        class="google-section"
        id="googleSection"
      >
        <div id="googleButton"></div>
      </div>


      <div
        class="auth-divider"
        id="authDivider"
      >
        <span>
          or continue with email
        </span>
      </div>


      <form id="authForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn primary full auth-submit"
          id="submitBtn"
        >
          Log in
        </button>

      </form>


      <form
        id="confirmForm"
        class="hidden confirmation-form"
      >

        <div class="confirmation-icon">
          ✉
        </div>

        <h2>
          Verify your email
        </h2>

        <p class="muted confirmation-copy">
          We sent a confirmation code to
          <strong id="confirmEmail"></strong>.
        </p>


        <div class="form-group">

          <label for="confirmationCode">
            Confirmation code
          </label>

          <input
            type="text"
            id="confirmationCode"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Enter verification code"
            required
          >

        </div>


        <button
          type="submit"
          class="btn primary full"
        >
          Confirm account
        </button>


        <button
          type="button"
          class="text-button"
          id="backToLogin"
        >
          Back to login
        </button>

      </form>


      <div
        id="authMessage"
        class="auth-message"
        role="status"
        aria-live="polite"
      ></div>


      <p class="auth-footnote">
        Secure authentication powered by Amazon Cognito and Google.
      </p>

    </section>

  </main>


  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

  <script src="config.js"></script>
  <script src="auth.js"></script>


  <script>

    let mode = 'login';
    let pendingEmail = '';

    const form =
      document.getElementById('authForm');

    const confirmForm =
      document.getElementById('confirmForm');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const submitBtn =
      document.getElementById('submitBtn');

    const googleSection =
      document.getElementById('googleSection');

    const authDivider =
      document.getElementById('authDivider');

    const message =
      document.getElementById('authMessage');

    const authTitle =
      document.getElementById('authTitle');

    const authSubtitle =
      document.getElementById('authSubtitle');


    if (
      typeof getApiToken === 'function' &&
      typeof tokenIsValid === 'function'
    ) {

      const existingToken =
        getApiToken();

      if (
        tokenIsValid(
          existingToken
        )
      ) {

        window.location.href =
          'index.html';

      }

    }


    function showMessage(
      text,
      type = 'error'
    ) {

      message.textContent =
        text;

      message.className =
        `auth-message ${type}`;

    }


    function updateModeUI() {

      document
        .querySelectorAll('.auth-tab')
        .forEach(tab => {

          tab.classList.toggle(
            'active',
            tab.dataset.mode === mode
          );

        });


      if (
        mode === 'login'
      ) {

        authTitle.textContent =
          'Welcome back';

        authSubtitle.textContent =
          'Sign in to continue to your vault.';

        submitBtn.textContent =
          'Log in';

        passwordInput.autocomplete =
          'current-password';

      } else {

        authTitle.textContent =
          'Create your account';

        authSubtitle.textContent =
          'Start securely storing your documents with DocVault.';

        submitBtn.textContent =
          'Create account';

        passwordInput.autocomplete =
          'new-password';

      }

    }


    function hideMainAuthentication() {

      form.classList.add(
        'hidden'
      );

      document
        .getElementById('authTabs')
        .classList.add(
          'hidden'
        );

      googleSection
        .classList.add(
          'hidden'
        );

      authDivider
        .classList.add(
          'hidden'
        );

      authTitle
        .classList.add(
          'hidden'
        );

      authSubtitle
        .classList.add(
          'hidden'
        );

    }


    function showMainAuthentication() {

      form.classList.remove(
        'hidden'
      );

      document
        .getElementById('authTabs')
        .classList.remove(
          'hidden'
        );

      googleSection
        .classList.remove(
          'hidden'
        );

      authDivider
        .classList.remove(
          'hidden'
        );

      authTitle
        .classList.remove(
          'hidden'
        );

      authSubtitle
        .classList.remove(
          'hidden'
        );

    }


    document
      .getElementById('authTabs')
      .addEventListener(
        'click',
        e => {

          const button =
            e.target.closest(
              '[data-mode]'
            );

          if (!button) {
            return;
          }

          mode =
            button.dataset.mode;

          updateModeUI();

          showMessage(
            '',
            ''
          );

        }
      );


    form.addEventListener(
      'submit',
      async e => {

        e.preventDefault();

        const email =
          emailInput
            .value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        submitBtn.disabled =
          true;

        submitBtn.textContent =
          mode === 'login'
            ? 'Signing in...'
            : 'Creating account...';

        showMessage(
          '',
          ''
        );


        try {

          if (
            mode === 'login'
          ) {

            await signIn(
              email,
              password
            );

            window.location.href =
              'index.html';

          } else {

            const result =
              await signUp(
                email,
                password
              );


            if (
              result.UserConfirmed
            ) {

              mode =
                'login';

              updateModeUI();

              showMessage(
                'Account created. You can now log in.',
                'success'
              );

            } else {

              pendingEmail =
                email;

              document
                .getElementById(
                  'confirmEmail'
                )
                .textContent =
                  email;

              hideMainAuthentication();

              confirmForm
                .classList
                .remove(
                  'hidden'
                );

              showMessage(
                '',
                ''
              );

            }

          }

        } catch (err) {

          if (
            String(
              err.message
            ).includes(
              'UserNotConfirmedException'
            )
          ) {

            pendingEmail =
              email;

            document
              .getElementById(
                'confirmEmail'
              )
              .textContent =
                email;

            hideMainAuthentication();

            confirmForm
              .classList
              .remove(
                'hidden'
              );

          } else {

            showMessage(
              err.message
            );

          }

        } finally {

          submitBtn.disabled =
            false;

          if (
            !form
              .classList
              .contains(
                'hidden'
              )
          ) {

            updateModeUI();

          }

        }

      }
    );


    confirmForm.addEventListener(
      'submit',
      async e => {

        e.preventDefault();

        const code =
          document
            .getElementById(
              'confirmationCode'
            )
            .value
            .trim();


        try {

          await confirmSignUp(
            pendingEmail,
            code
          );

          confirmForm
            .classList
            .add(
              'hidden'
            );

          showMainAuthentication();

          mode =
            'login';

          updateModeUI();

          showMessage(
            'Account confirmed. You can now log in.',
            'success'
          );

        } catch (err) {

          showMessage(
            err.message
          );

        }

      }
    );


    document
      .getElementById(
        'backToLogin'
      )
      .addEventListener(
        'click',
        () => {

          confirmForm
            .classList
            .add(
              'hidden'
            );

          showMainAuthentication();

          mode =
            'login';

          updateModeUI();

          showMessage(
            '',
            ''
          );

        }
      );

  </script>

</body>
</html>

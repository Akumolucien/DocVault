<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocVault — Sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F4EFE6;
    color: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .logo {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .logo span { color: #C9922A; }
  .subtitle {
    color: #7a7a7a;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .tabs {
    display: flex;
    margin-bottom: 24px;
    border-bottom: 1px solid #eee;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    cursor: pointer;
    font-size: 14px;
    color: #7a7a7a;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: #1a1a1a;
    font-weight: 600;
    border-bottom: 2px solid #1a1a1a;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 16px;
    color: #444;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #C9922A;
  }
  .btn {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #333; }
  .note {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Doc<span>Vault</span></div>
  <div class="subtitle">Sign in to access your documents</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin">Log in</div>
    <div class="tab" id="tabSignup">Sign up</div>
  </div>

  <form id="authForm">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" required>

    <button type="submit" class="btn" id="submitBtn">Log in</button>
  </form>

  <div class="note">Powered by AWS Cognito — coming soon</div>
</div>

<script>
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const submitBtn = document.getElementById('submitBtn');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
    submitBtn.textContent = 'Log in';
  });

  tabSignup.addEventListener('click', () => {
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
    submitBtn.textContent = 'Create account';
  });

  document.getElementById('authForm').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Cognito wiring coming next — this is just the UI for now.');
  });
</script>

</body>
</html>
